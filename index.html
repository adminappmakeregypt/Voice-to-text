<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحويل الفيديو إلى نص</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>🎬 تحويل الفيديو إلى نص</h1>

    <div class="tabs">
      <button class="tab active" data-engine="azure">⭐ Azure (سريع ودقيق)</button>
      <button class="tab" data-engine="whisper">Whisper (مجاني على جهازك)</button>
    </div>

    <details id="azureSettings" class="settings">
      <summary>⚙️ إعدادات Azure (المفتاح والمنطقة)</summary>
      <label for="azKey">Speech Key</label>
      <input type="password" id="azKey" placeholder="الصق المفتاح هنا">
      <label for="azRegion">Region</label>
      <input type="text" id="azRegion" placeholder="مثال: westeurope أو eastus">
      <button id="saveAz" class="small">حفظ</button>
      <p class="hint">المفتاح بيتحفظ على جهازك بس، ومش موجود في الكود.</p>
    </details>

    <div id="whisperSettings" class="settings" hidden>
      <label for="model">الموديل</label>
      <select id="model">
        <option value="Xenova/whisper-base">Base — أسرع (~80MB)</option>
        <option value="Xenova/whisper-small" selected>Small — أدق (~250MB)</option>
      </select>
      <p class="hint">أول مرة بيحمّل الموديل، وبعد كده بيشتغل من غير نت. الفيديو مش بيخرج من جهازك.</p>
    </div>

    <label for="lang">لغة الكلام</label>
    <select id="lang">
      <option value="ar-EG|arabic">العربية (مصري)</option>
      <option value="ar-SA|arabic">العربية (فصحى/سعودي)</option>
      <option value="en-US|english">English</option>
      <option value="fr-FR|french">Français</option>
    </select>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="video/*,audio/*" hidden>
      <span id="dropText">📁 اختار فيديو أو ملف صوت، أو اسحبه هنا</span>
    </label>

    <video id="preview" controls hidden></video>

    <button id="start" class="primary wide" disabled>✍️ حوّل لنص</button>

    <div class="progress" id="progressWrap" hidden><div id="progressBar"></div></div>
    <p id="status" class="status">جاهز</p>

    <textarea id="output" placeholder="النص هيظهر هنا..."></textarea>

    <div class="buttons">
      <button id="copy">📋 نسخ</button>
      <button id="dlTxt">⬇ TXT</button>
      <button id="dlSrt">⬇ SRT (ترجمة)</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
